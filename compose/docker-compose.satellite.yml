---
x-podman:
  &podman
  init: true
  userns_mode: keep-id
  security_opt:
    - "label=disable"

x-hardened: &hardened
  userns_mode: keep-id
  init: true
  security_opt:
    - "label=disable"
    - "no-new-privileges:true"
  cap_drop:
    - ALL

x-resource-limits: &resource-limits
  deploy:
    resources:
      limits:
        memory: ${STANDARD_MEMORY_LIMIT:-1G}
      reservations:
        memory: 64M

x-light-resource-limits: &light-resource-limits
  deploy:
    resources:
      limits:
        memory: ${LIGHT_MEMORY_LIMIT:-512M}
      reservations:
        memory: 32M

x-logging:
  &default-logging
  driver: json-file
  options:
    mode: non-blocking
    max-buffer-size: 4m
    max-size: "10m"
    max-file: "3"

volumes:
  ovos_models:
    name: ovos_models
    driver: local
  ovos_listener_records:
    name: ovos_listener_records
    driver: local
  ovos_tts_cache:
    name: ovos_tts_cache
    driver: local

services:
  hivemind_satellite:
    <<: [*podman, *resource-limits]
    container_name: hivemind_satellite
    hostname: hivemind_satellite
    restart: unless-stopped
    image: smartgic/hivemind-satellite:${VERSION}
    logging: *default-logging
    pull_policy: always
    environment:
      PULSE_SERVER: unix:${XDG_RUNTIME_DIR}/pulse/native
      PULSE_COOKIE: /home/${HIVEMIND_USER}/.config/pulse/cookie
      TZ: $TZ
      VOICE_SAT_KEY: $VOICE_SAT_KEY
      VOICE_SAT_PASSWORD: $VOICE_SAT_PASSWORD
      VOICE_SAT_HOST: $VOICE_SAT_HOST
      VOICE_SAT_PORT: $VOICE_SAT_PORT
      HIVEMIND_SITEID: ${HIVEMIND_SITEID:-default}
      XDG_RUNTIME_DIR: $XDG_RUNTIME_DIR
    devices:
      - /dev/snd
    volumes:
      - ~/.config/pulse/cookie:/home/${HIVEMIND_USER}/.config/pulse/cookie:ro
      - ${OVOS_CONFIG_FOLDER}:/home/${HIVEMIND_USER}/.config/mycroft:ro
      - ovos_tts_cache:/home/${HIVEMIND_USER}/.cache/mycroft
      - ovos_listener_records:/home/${HIVEMIND_USER}/.local/share/mycroft/listener
      - ovos_models:/home/${HIVEMIND_USER}/.local/share/precise-lite
      - ${XDG_RUNTIME_DIR}/pipewire-0:${XDG_RUNTIME_DIR}/pipewire-0:ro
      - ${XDG_RUNTIME_DIR}/pulse:${XDG_RUNTIME_DIR}/pulse:ro

  hivemind_cli:
    <<: [*hardened, *light-resource-limits]
    container_name: hivemind_cli
    hostname: hivemind_cli
    restart: unless-stopped
    image: docker.io/smartgic/hivemind-cli:${VERSION}
    logging: *default-logging
    pull_policy: always
    tty: true
    environment:
      TZ: $TZ
    network_mode: host
    volumes:
      - ${HIVEMIND_CONFIG_FOLDER}:/home/${HIVEMIND_USER}/.config/hivemind:z
      - ${HIVEMIND_SHARE_FOLDER}:/home/${HIVEMIND_USER}/.local/share/hivemind:z
    depends_on:
      - hivemind_satellite
