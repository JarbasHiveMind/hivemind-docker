{
  "play_wav_cmdline": "true %1",
  "play_mp3_cmdline": "mpv --no-video --ao=null %1",
  "play_ogg_cmdline": "mpv --no-video --ao=null %1",

  "tts": {
    "module": "ovos-tts-plugin-server"
  },

  "Audio": {
    "backends": {
      "OCP": {
        "type": "ovos_common_play",
        "preferred_audio_services": ["mpv", "vlc"],
        "disable_mpris": true,
        "manage_external_players": false,
        "active": true
      },
      "vlc": {
        "type": "vlc",
        "active": true,
        "args": ["--no-video", "--aout=dummy"]
      },
      "mpv": {
        "type": "mpv",
        "active": true,
        "args": ["--no-video", "--ao=null"]
      }
    }
  }
}
