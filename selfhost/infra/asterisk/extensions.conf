[from-internal]
exten => assistant,1,NoOp(Call to assistant)
 same => n,Dial(PJSIP/assistant,30)
 same => n,Hangup()

exten => caller,1,NoOp(Call to caller)
 same => n,Dial(PJSIP/caller,30)
 same => n,Hangup()

; also allow dialing raw extension numbers matching endpoint names
exten => _X.,1,NoOp(Generic dial ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
