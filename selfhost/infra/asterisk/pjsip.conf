[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---- assistant account (bridge registers as this) ----
[assistant]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=assistant
aors=assistant
direct_media=no

[assistant]
type=auth
auth_type=userpass
username=assistant
password=assistantpass

[assistant]
type=aor
max_contacts=1
remove_existing=yes

; ---- caller account (test caller registers as this) ----
[caller]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=caller
aors=caller
direct_media=no

[caller]
type=auth
auth_type=userpass
username=caller
password=callerpass

[caller]
type=aor
max_contacts=1
remove_existing=yes
