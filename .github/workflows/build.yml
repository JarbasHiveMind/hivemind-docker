name: Build & Smoke

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap, dependency-light validation: compose files parse and the Bake graph
  # renders. Runs on every PR and push and gates the build.
  smoke:
    name: Compose & Bake validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Run smoke checks
        run: ./scripts/smoke.sh

  # Build every image via Buildx Bake. base-image wiring relies on Bake
  # `contexts`, so a plain `docker build` per Dockerfile would not work; bake
  # the whole graph instead. No push on this job — it is a CI check.
  build:
    name: Build images (bake, no push)
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build all images (linux/amd64, no push)
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5
        with:
          targets: default
          push: false
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          TAG: alpha
          CHANNEL: alpha
          VERSION: ci-${{ github.sha }}
          UV_PRERELEASE: allow
          GIT_SHA: ${{ github.sha }}

  # Publish multi-arch images on push to dev/master, but only when Docker Hub
  # credentials are configured. Without the secrets this job is skipped so the
  # build check still passes on forks/PRs.
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for registry credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials not set; skipping publish."
          fi

      - name: Set up QEMU
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push (multi-arch)
        if: steps.creds.outputs.available == 'true'
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5
        with:
          targets: default
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          # dev publishes the alpha channel; master publishes stable.
          TAG: ${{ github.ref == 'refs/heads/master' && 'stable' || 'alpha' }}
          CHANNEL: ${{ github.ref == 'refs/heads/master' && 'stable' || 'alpha' }}
          VERSION: ${{ github.ref == 'refs/heads/master' && 'stable' || 'alpha' }}
          UV_PRERELEASE: ${{ github.ref == 'refs/heads/master' && 'never' || 'allow' }}
          GIT_SHA: ${{ github.sha }}
