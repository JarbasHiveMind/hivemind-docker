name: Publish on push

# A commit on dev rebuilds the images whose build context changed (plus everything built on top of
# them) for every channel. Channels run one at a time to stay within the registry's pull budget.

on:
  push:
    branches: [dev]

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: publish-push
  cancel-in-progress: false

jobs:
  select:
    name: Affected targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.sel.outputs.targets }}
      count: ${{ steps.sel.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - id: sel
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Diff from the last commit this workflow actually published, not from this push's own
          # parent. Only one run may sit pending in a concurrency group, so when several merges
          # land minutes apart the middle ones are cancelled - and the next push's
          # github.event.before is the cancelled push's head, so whatever that push would have
          # rebuilt is skipped for good rather than retried. hivemind base/Dockerfile changed on
          # 2026-09-09 and was still unpublished two days later because of exactly that.
          last=$(gh run list --workflow on-push.yml --branch "$GITHUB_REF_NAME" \
                   --status success --limit 1 --json headSha -q '.[0].headSha' 2>/dev/null || true)
          if [ -n "$last" ] && git cat-file -e "$last" 2> /dev/null; then
            echo "diffing from the last successful publish: $last"
            BEFORE="$last"
          fi
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2> /dev/null; then
            echo "no usable base commit -> building everything"
            files="docker-bake.hcl"
          else
            files=$(git diff --name-only "$BEFORE" "$HEAD")
          fi
          printf '%s\n' "$files"
          targets=$(printf '%s\n' "$files" | python3 scripts/affected.py paths)
          echo "targets: $targets"
          echo "targets=$(echo "$targets" | jq -r 'join(" ")')" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$targets" | jq length)" >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ matrix.channel }}
    needs: select
    if: needs.select.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: [alpha, testing, stable]
    uses: OpenVoiceOS/ovos-docker/.github/workflows/build-images.yml@64976c5e9dab28b6692a259d16a0f95129622a0b # v2.1.0
    with:
      channel: ${{ matrix.channel }}
      targets: ${{ needs.select.outputs.targets }}
      push: true
      mirror_registry: ghcr.io/jarbashivemind/hivemind-docker
    secrets:
      # secrets: inherit does not cross organization boundaries (the reusable
      # workflow lives in OpenVoiceOS); they must be passed explicitly.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
